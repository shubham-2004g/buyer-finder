<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in | Hearth Leads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .wrap{min-height:100vh;display:grid;place-items:center;padding:20px}
  .box{width:100%;max-width:400px}
  .box .brand{margin-bottom:22px;justify-content:center}
  .err{display:none;margin:0 0 12px}
</style>
</head>
<body>
<main class="wrap">
  <div class="box">
    <div class="brand"><span class="mark"></span>Hearth Leads</div>
    <section class="card">
      <h2>Log in</h2>
      <p class="hint">Sign in to find US home decor buyers and email them.</p>
      <div id="err" class="state error err"></div>
      <form id="f">
        <label>Username <input id="u" autocomplete="username" required autofocus></label>
        <label>Password <input id="p" type="password" autocomplete="current-password" required></label>
        <button class="btn primary" id="go" type="submit">Log in</button>
      </form>
    </section>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
$("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("go").disabled = true; $("err").style.display = "none";
  try {
    const r = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: $("u").value.trim(), password: $("p").value }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "Login failed");
    location.href = "/";
  } catch (x) {
    $("err").textContent = x.message;
    $("err").style.display = "block";
    $("go").disabled = false;
  }
});
</script>
</body>
</html>
